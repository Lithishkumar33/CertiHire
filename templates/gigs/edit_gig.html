{% extends "base_dashboard.html" %}
{% load static %}

{% block title %}

Edit Gig

{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-body">

            <h2 class="mb-4">

                Edit Gig

            </h2>

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="btn btn-primary">

                    Update Gig

                </button>

                <a href="{% url 'my_gigs' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
