{% extends "base_dashboard.html" %}

{% block title %}

Delete Gig

{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-sm mx-auto"
         style="max-width:550px;">

        <div class="card-body text-center">

            <i class="bi bi-trash display-2 text-danger"></i>

            <h2 class="mt-3">

                Delete Gig?

            </h2>

            <p>

                Are you sure you want to delete

                <strong>

                    "{{ gig.title }}"

                </strong>?

            </p>

            <p class="text-danger">

                This action cannot be undone.

            </p>

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger">

                    Yes, Delete

                </button>

                <a href="{% url 'my_gigs' %}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
