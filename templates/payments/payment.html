{% extends "base_dashboard.html" %}

{% block content %}

<div class="text-center py-5">

    <div class="mb-4">

        <i class="bi bi-shield-check"
           style="
               font-size:60px;
               color:#2563eb;
           ">
        </i>

    </div>

    <h2>
        Secure Payment
    </h2>

    <p class="text-muted">
        Redirecting you to Cashfree secure checkout...
    </p>

    <div class="spinner-border text-primary mt-3"
         role="status">

    </div>

</div>


<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const paymentSessionId =
            "{{ payment_session_id }}";


        console.log(
            "Cashfree Payment Session:",
            paymentSessionId
        );


        if (
            !paymentSessionId ||
            paymentSessionId === "None"
        ) {

            console.error(
                "Payment Session ID is missing"
            );

            alert(
                "Unable to start payment. Please try again."
            );

            window.location.href =
                "{% url 'payment_failed' %}";

            return;
        }


        const cashfree = Cashfree({

            mode: "sandbox"

        });


        const checkoutOptions = {

            paymentSessionId:
                paymentSessionId,

            redirectTarget:
                "_self"

        };


        cashfree.checkout(
            checkoutOptions
        );

    }

);

</script>

{% endblock %}
